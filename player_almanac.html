    { lvl: '0', name: 'Thorn Whip', src: 'SRD', cast: '1A', range: '30 ft', conc: false, rit: false, notes: '1d6 pierc, pull 10ft', desc: 'You create a long, vine-like whip covered in thorns that lashes out at a creature within range. Make a melee spell attack. On hit, creature takes 1d6 piercing damage and if Large or smaller, you pull the creature up to 10 feet closer to you. Damage increases at 5th (2d6), 11th (3d6), and 17th level (4d6).' },
    { lvl: '0', name: 'True Strike', src: 'SRD', cast: '1A', range: 'Self', conc: false, rit: false, notes: 'Weapon atk w/ spell mod', desc: 'Guided by a flash of magical insight, you make one attack with a weapon you are holding. The attack uses your spellcasting ability for the attack and damage rolls instead of Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon\'s normal damage type (your choice). Cantrip Upgrade: The attack deals extra Radiant damage at levels 5 (+1d6), 11 (+2d6), and 17 (+3d6).' },
    { lvl: '0', name: 'Vicious Mockery', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '1d6 psychic, disadv', desc: 'You unleash a string of insults laced with subtle enchantments at a creature you can see within range. If the target can hear you (it need not understand), it must succeed on a WIS save or take 1d6 psychic damage and have disadvantage on the next attack roll it makes before the end of its next turn. Damage increases at 5th (2d6), 11th (3d6), and 17th level (4d6).' },
    // Level 1
    { lvl: '1', name: 'Alarm', src: 'SRD', cast: '1 min', range: '30 ft', conc: false, rit: true, notes: '8 hours, alerts', desc: 'You set an alarm against unwanted intrusion. Choose a door, window, or area within range no larger than a 20-foot cube. Until the spell ends, an alarm alerts you whenever a Tiny or larger creature touches or enters the warded area. Choose mental alarm (only you hear it within 1 mile) or audible alarm (10 seconds of ringing audible within 60 feet).' },
    { lvl: '1', name: 'Bless', src: 'SRD', cast: '1A', range: '30 ft', conc: true, rit: false, notes: '+1d4 atk/saves, 3 tgts', desc: 'You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw. Duration: Concentration, up to 1 minute. At Higher Levels: one additional creature per slot level above 1st.' },
    { lvl: '1', name: 'Burning Hands', src: 'SRD', cast: '1A', range: '15 ft cone', conc: false, rit: false, notes: '3d6 fire, DEX half', desc: 'As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a DEX save. A creature takes 3d6 fire damage on a failed save, or half as much on a successful one. Ignites flammable objects not being worn or carried.' },
    { lvl: '1', name: 'Charm Person', src: 'SRD', cast: '1A', range: '30 ft', conc: false, rit: false, notes: 'Charmed 1hr, WIS', desc: 'You attempt to charm a humanoid you can see within range. It must make a WIS save (advantage if you or companions are fighting it). If it fails, it is charmed by you until the spell ends or until you or companions do anything harmful to it. The charmed creature regards you as a friendly acquaintance. When the spell ends, it knows it was charmed.' },
    { lvl: '1', name: 'Cure Wounds', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: '2d8+mod healing', desc: 'A creature you touch regains a number of hit points equal to 2d8 + your spellcasting ability modifier. At Higher Levels: healing increases by 2d8 for each slot level above 1st.' },
    { lvl: '1', name: 'Detect Magic', src: 'SRD', cast: '1A', range: 'Self', conc: true, rit: true, notes: 'Sense magic 30ft', desc: 'For the duration, you sense the presence of magic within 30 feet of you. If you sense magic this way, you can use your action to see a faint aura around any visible creature or object that bears magic, and you learn its school of magic. The spell can penetrate most barriers, but is blocked by 1 foot of stone, 1 inch of metal, a thin sheet of lead, or 3 feet of wood/dirt.' },
    { lvl: '1', name: 'Disguise Self', src: 'SRD', cast: '1A', range: 'Self', conc: false, rit: false, notes: 'Appear different, 1hr', desc: 'You make yourself"including clothing, armor, weapons, and belongings"look different until the spell ends or until you dismiss it. You can seem 1 foot shorter or taller and can appear thin, fat, or in between. You can\'t change body type, and your limbs must remain present. Investigation check vs your spell DC to discern disguise.' },
    { lvl: '1', name: 'Faerie Fire', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'Adv on attacks, 20ft', desc: 'Each object in a 20-foot cube within range is outlined in blue, green, or violet light (your choice). Any creature in the area when the spell is cast is also outlined if it fails a DEX save. For the duration, affected objects and creatures shed dim light in a 10-foot radius. Any attack roll against an affected creature or object has advantage if the attacker can see it, and they can\'t benefit from being invisible.' },
    { lvl: '1', name: 'Feather Fall', src: 'SRD', cast: '1 React', range: '60 ft', conc: false, rit: false, notes: 'Slow fall, 5 creatures', desc: 'Choose up to five falling creatures within range. A falling creature\'s rate of descent slows to 60 feet per round until the spell ends. If the creature lands before the spell ends, it takes no falling damage and can land on its feet, and the spell ends for that creature. Duration: 1 minute.' },
    { lvl: '1', name: 'Find Familiar', src: 'SRD', cast: '1 hour', range: '10 ft', conc: false, rit: true, notes: 'Spirit companion', desc: 'You gain the service of a familiar, a spirit that takes an animal form you choose (bat, cat, crab, frog, hawk, lizard, octopus, owl, snake, fish, rat, raven, sea horse, spider, or weasel). The familiar acts independently but obeys your commands. You can communicate with it telepathically within 100 feet and see through its senses. It can\'t attack. If it drops to 0 HP, it disappears.' },
    { lvl: '1', name: 'Fog Cloud', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '20ft heavily obscured', desc: 'You create a 20-foot-radius sphere of fog centered on a point within range. The sphere spreads around corners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it. At Higher Levels: radius increases by 20 feet per slot level above 1st.' },
    { lvl: '1', name: 'Goodberry', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: '10 berries, 1 HP each', desc: 'Up to ten berries appear in your hand and are infused with magic for the duration. A creature can use its action to eat one berry. Eating a berry restores 1 hit point, and the berry provides enough nourishment to sustain a creature for one day. The berries lose their potency if they have not been consumed within 24 hours.' },
    { lvl: '1', name: 'Guiding Bolt', src: 'SRD', cast: '1A', range: '120 ft', conc: false, rit: false, notes: '4d6 radiant, adv next', desc: 'A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack. On hit, the target takes 4d6 radiant damage, and the next attack roll made against this target before the end of your next turn has advantage, thanks to the mystical dim light glittering on the target until then. At Higher Levels: +1d6 per slot level above 1st.' },
    { lvl: '1', name: 'Healing Word', src: 'SRD', cast: '1 BA', range: '60 ft', conc: false, rit: false, notes: '2d4+mod healing', desc: 'A creature of your choice that you can see within range regains hit points equal to 2d4 + your spellcasting ability modifier. At Higher Levels: healing increases by 2d4 for each slot level above 1st.' },
    { lvl: '1', name: 'Hellish Rebuke', src: 'SRD', cast: '1 React', range: '60 ft', conc: false, rit: false, notes: '2d10 fire, DEX half', desc: 'You point your finger at a creature that damaged you. The creature must make a DEX save. It takes 2d10 fire damage on a failed save, or half as much on a success. At Higher Levels: +1d10 per slot level above 1st. Casting Time: 1 reaction, which you take in response to being damaged by a creature within 60 feet that you can see.' },
    { lvl: '1', name: 'Hex', src: 'SRD', cast: '1 BA', range: '90 ft', conc: true, rit: false, notes: '+1d6 necrotic', desc: 'You place a curse on a creature you can see within range. Until the spell ends, you deal an extra 1d6 necrotic damage to the target whenever you hit it with an attack. Also choose one ability; the target has disadvantage on ability checks made with that ability. If the target drops to 0 HP, you can use a bonus action to curse a new creature. Duration based on slot level.' },
    { lvl: '1', name: 'Hunter\'s Mark', cast: '1 BA', range: '90 ft', conc: true, rit: false, notes: '+1d6 damage', desc: 'You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Perception or Survival check you make to find it. If the target drops to 0 HP, you can use a bonus action to mark a new creature.' },
    { lvl: '1', name: 'Identify', src: 'SRD', cast: '1 min', range: 'Touch', conc: false, rit: true, notes: 'Learn item properties', desc: 'You choose one object that you must touch throughout the casting of the spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement, and how many charges it has. You learn whether any spells are affecting the item and what they are. You also learn if a creature is affected by any spells.' },
    { lvl: '1', name: 'Inflict Wounds', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: '3d10 necrotic', desc: 'Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage. At Higher Levels: +1d10 per slot level above 1st.' },
    { lvl: '1', name: 'Mage Armor', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'AC 13+DEX, 8hrs', desc: 'You touch a willing creature who isn\'t wearing armor, and a protective magical force surrounds it until the spell ends. The target\'s base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action. Duration: 8 hours.' },
    { lvl: '1', name: 'Magic Missile', src: 'SRD', cast: '1A', range: '120 ft', conc: false, rit: false, notes: '3x 1d4+1 force', desc: 'You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4+1 force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several. At Higher Levels: +1 dart per slot level above 1st.' },
    { lvl: '1', name: 'Shield', src: 'SRD', cast: '1 React', range: 'Self', conc: false, rit: false, notes: '+5 AC until next turn', desc: 'An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile. Casting Time: 1 reaction, which you take when you are hit by an attack or targeted by the magic missile spell.' },
    { lvl: '1', name: 'Shield of Faith', src: 'SRD', cast: '1 BA', range: '60 ft', conc: true, rit: false, notes: '+2 AC, 10 min', desc: 'A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration. Duration: Concentration, up to 10 minutes.' },
    { lvl: '1', name: 'Sleep', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'WIS save, 5ft radius', desc: 'Each creature in a 5-foot-radius sphere centered on a point within range must succeed on a WIS save or become Incapacitated until the end of its next turn, at which point it must repeat the save. On a second failed save, the creature falls Unconscious for the duration. The spell ends on a creature that takes damage or is shaken awake as an action. Undead and creatures immune to being charmed aren\'t affected. At Higher Levels: The area increases by 5 feet for each slot level above 1st. Duration: Concentration, up to 1 minute.' },
    { lvl: '1', name: 'Thunderwave', src: 'SRD', cast: '1A', range: '15 ft cube', conc: false, rit: false, notes: '2d8 thunder, push', desc: 'A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you must make a CON save. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a success, half damage and not pushed. Unsecured objects are automatically pushed. The thunder is audible out to 300 feet. At Higher Levels: +1d8 per slot above 1st.' },
    // Level 2
    { lvl: '2', name: 'Aid', src: 'SRD', cast: '1A', range: '30 ft', conc: false, rit: false, notes: '+5 max HP, 3 tgts, 8hr', desc: 'Your spell bolsters your allies with toughness and resolve. Choose up to three creatures within range. Each target\'s hit point maximum and current hit points increase by 5 for the duration. At Higher Levels: +5 HP per slot level above 2nd. Duration: 8 hours.' },
    { lvl: '2', name: 'Blur', src: 'SRD', cast: '1A', range: 'Self', conc: true, rit: false, notes: 'Disadv attacks vs you', desc: 'Your body becomes blurred, shifting and wavering to all who can see you. For the duration, any creature has disadvantage on attack rolls against you. An attacker is immune to this effect if it doesn\'t rely on sight, has truesight, or can perceive illusions as false. Duration: Concentration, up to 1 minute.' },
    { lvl: '2', name: 'Darkness', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: '15ft magical darkness', desc: 'Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. Darkvision can\'t see through this darkness, and nonmagical light can\'t illuminate it. If the point is on an object you\'re holding or one that isn\'t being worn or carried, the darkness emanates from the object and moves with it. Completely covering the source blocks the darkness.' },
    { lvl: '2', name: 'Darkvision', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: '60ft darkvision, 8hr', desc: 'You touch a willing creature to grant it the ability to see in the dark. For the duration, that creature has darkvision out to a range of 60 feet. Duration: 8 hours.' },
    { lvl: '2', name: 'Enhance Ability', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Adv on ability, 1hr', desc: 'You touch a creature and bestow upon it a magical enhancement. Choose one: Bear\'s Endurance (adv CON, +2d6 temp HP), Bull\'s Strength (adv STR, 2x carrying capacity), Cat\'s Grace (adv DEX, no falling damage up to 20ft), Eagle\'s Splendor (adv CHA), Fox\'s Cunning (adv INT), or Owl\'s Wisdom (adv WIS). Duration: Concentration, up to 1 hour.' },
    { lvl: '2', name: 'Enlarge/Reduce', src: 'SRD', cast: '1A', range: '30 ft', conc: true, rit: false, notes: 'Size +/-1d4 dmg', desc: 'You cause a creature or object you can see within range to grow larger or smaller for the duration. Choose Enlarge (target\'s size doubles in all dimensions, weight x8, size increases one category, advantage on STR checks and saves, +1d4 weapon damage) or Reduce (size halves, weight x1/8, size decreases one category, disadvantage on STR, -1d4 weapon damage). Unwilling target: CON save.' },
    { lvl: '2', name: 'Flaming Sphere', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: '2d6 fire, move BA', desc: 'A 5-foot-diameter sphere of fire appears in an unoccupied space of your choice within range. Any creature that ends its turn within 5 feet of the sphere must make a DEX save or take 2d6 fire damage, or half on success. As a bonus action, you can move the sphere up to 30 feet. It ignites flammable objects not being worn or carried. At Higher Levels: +1d6 per slot above 2nd.' },
    { lvl: '2', name: 'Heat Metal', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: '2d8 fire, disadv', desc: 'Choose a manufactured metal object, such as a metal weapon or suit of heavy or medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in contact with the object takes 2d8 fire damage. Until the spell ends, you can use a bonus action to cause this damage again. If creature is holding the object, it must succeed on a CON save or drop the object. If it doesn\'t drop the object, it has disadvantage on attack rolls and ability checks until the start of your next turn.' },
    { lvl: '2', name: 'Hold Person', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'Paralyze human, WIS', desc: 'Choose a humanoid that you can see within range. The target must succeed on a WIS save or be paralyzed for the duration. At the end of each of its turns, the target can make another WIS save. On a success, the spell ends on the target. At Higher Levels: +1 target per slot level above 2nd. Duration: Concentration, up to 1 minute.' },
    { lvl: '2', name: 'Invisibility', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Invisible til atk/cast', desc: 'A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target\'s person. The spell ends for a target that attacks or casts a spell. At Higher Levels: +1 target per slot level above 2nd. Duration: Concentration, up to 1 hour.' },
    { lvl: '2', name: 'Lesser Restoration', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'End disease/condition', desc: 'You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned.' },
    { lvl: '2', name: 'Misty Step', src: 'SRD', cast: '1 BA', range: 'Self', conc: false, rit: false, notes: 'Teleport 30 ft', desc: 'Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see.' },
    { lvl: '2', name: 'Moonbeam', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '2d10 radiant, 5ft cyl', desc: 'A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high cylinder centered on a point within range. Until the spell ends, dim light fills the cylinder. When a creature enters the spell\'s area for the first time on a turn or starts its turn there, it must make a CON save or take 2d10 radiant damage, or half on success. A shapechanger makes this save with disadvantage. On failed save, it also reverts to original form and can\'t assume another form until it leaves the spell\'s light. On each of your turns, you can move the beam up to 60 feet in any direction as an action.' },
    { lvl: '2', name: 'Pass without Trace', src: 'SRD', cast: '1A', range: 'Self', conc: true, rit: false, notes: '+10 Stealth, no tracks', desc: 'A veil of shadows and silence radiates from you, masking you and your companions from detection. For the duration, each creature you choose within 30 feet of you (including you) has a +10 bonus to Dexterity (Stealth) checks and can\'t be tracked except by magical means. A creature that receives this bonus leaves behind no tracks or other traces of its passage. Duration: Concentration, up to 1 hour.' },
    { lvl: '2', name: 'Scorching Ray', src: 'SRD', cast: '1A', range: '120 ft', conc: false, rit: false, notes: '3x 2d6 fire rays', desc: 'You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 fire damage. At Higher Levels: +1 ray per slot level above 2nd.' },
    { lvl: '2', name: 'Shatter', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '3d8 thunder, 10ft', desc: 'A sudden loud ringing noise, painfully intense, erupts from a point of your choice within range. Each creature in a 10-foot-radius sphere centered on that point must make a CON save. A creature takes 3d8 thunder damage on a failed save, or half on success. A creature made of inorganic material such as stone, crystal, or metal has disadvantage on this save. A nonmagical object not being worn or carried also takes the damage if it\'s in the spell\'s area. At Higher Levels: +1d8 per slot above 2nd.' },
    { lvl: '2', name: 'Silence', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: true, notes: '20ft no sound', desc: 'For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it. Casting a spell that includes a verbal component is impossible there. Duration: Concentration, up to 10 minutes.' },
    { lvl: '2', name: 'Spider Climb', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Walk walls/ceilings', desc: 'Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed. Duration: Concentration, up to 1 hour.' },
    { lvl: '2', name: 'Spiritual Weapon', src: 'SRD', cast: '1 BA', range: '60 ft', conc: false, rit: false, notes: '1d8+mod force, BA', desc: 'You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier. As a bonus action on your turn, you can move the weapon up to 20 feet and repeat the attack against a creature within 5 feet of it. At Higher Levels: +1d8 damage per two slot levels above 2nd. Duration: 1 minute.' },
    { lvl: '2', name: 'Suggestion', src: 'SRD', cast: '1A', range: '30 ft', conc: true, rit: false, notes: 'Suggest action, WIS', desc: 'You suggest a course of activity (limited to a sentence or two) and magically influence a creature you can see within range that can hear and understand you. Creatures that can\'t be charmed are immune. The suggestion must be worded to make the course of action sound reasonable. Asking the creature to stab itself is obviously harmful and the spell ends. The target must make a WIS save. On a failed save, it pursues the course of action you described to the best of its ability. The suggested activity can continue for the entire duration. If the activity can be completed in a shorter time, the spell ends when the subject finishes what it was asked to do.' },
    { lvl: '2', name: 'Web', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: '20ft restrain, DEX', desc: 'You conjure a mass of thick, sticky webbing at a point of your choice within range. The webs fill a 20-foot cube from that point for the duration. The webs are difficult terrain and lightly obscure the area. If the webs aren\'t anchored between two solid masses or layered across a floor, wall, or ceiling, they collapse on themselves and the spell ends. Each creature that starts its turn in the webs or enters them must make a DEX save. On a failed save, the creature is restrained as long as it remains in the webs. A restrained creature can use its action to make a STR check against your spell DC, freeing itself on a success. The webs are flammable.' },
    // Level 3
    { lvl: '3', name: 'Animate Dead', src: 'SRD', cast: '1 min', range: '10 ft', conc: false, rit: false, notes: 'Create skeleton/zombie', desc: 'This spell creates an undead servant. Choose a pile of bones or a corpse of a Medium or Small humanoid within range. Your spell imbues the target with a foul mimicry of life, raising it as a skeleton (if bones) or zombie (if corpse). On each of your turns, you can use a bonus action to mentally command any creature you made with this spell if it\'s within 60 feet. The creature is under your control for 24 hours, after which it stops obeying. To maintain control for another 24 hours, you must cast this spell on the creature again.' },
    { lvl: '3', name: 'Beacon of Hope', src: 'SRD', cast: '1A', range: '30 ft', conc: true, rit: false, notes: 'Adv WIS, max healing', desc: 'This spell bestows hope and vitality. Choose any number of creatures within range. For the duration, each target has advantage on Wisdom saving throws and death saving throws, and regains the maximum number of hit points possible from any healing. Duration: Concentration, up to 1 minute.' },
    { lvl: '3', name: 'Bestow Curse', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Curse target, WIS', desc: 'You touch a creature, and that creature must succeed on a WIS save or become cursed. Choose one: disadvantage on checks and saves with one ability score; disadvantage on attacks against you; must make WIS save each turn or waste action doing nothing; or your attacks deal an extra 1d8 necrotic damage to it. A remove curse spell ends this. At Higher Levels: duration increases with slot level, and at 5th level+ requires no concentration.' },
    { lvl: '3', name: 'Call Lightning', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '3d10 lightning, DEX', desc: 'A storm cloud appears in the shape of a cylinder 10 feet tall with a 60-foot radius, centered on a point you can see 100 feet directly above you. Each creature within 5 feet of a point you choose under the cloud must make a DEX save. A creature takes 3d10 lightning damage on a failed save, or half on success. On each of your turns until the spell ends, you can use your action to call down lightning this way again, targeting the same point or a different one. At Higher Levels: +1d10 per slot above 3rd.' },
    { lvl: '3', name: 'Counterspell', src: 'SRD', cast: '1 React', range: '60 ft', conc: false, rit: false, notes: 'Interrupt spell, CON save', desc: 'You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, it must make a Constitution saving throw. On a failed save, the spell fails and has no effect. At Higher Levels: The interrupted spell automatically fails if its level is equal to or lower than the spell slot used.' },
    { lvl: '3', name: 'Dispel Magic', src: 'SRD', cast: '1A', range: '120 ft', conc: false, rit: false, notes: 'End spells on target', desc: 'Choose one creature, object, or magical effect within range. Any spell of 3rd level or lower on the target ends. For each spell of 4th level or higher on the target, make an ability check using your spellcasting ability. The DC equals 10 + the spell\'s level. On a successful check, the spell ends. At Higher Levels: automatically end spells on the target if equal to or lower than the slot used.' },
    { lvl: '3', name: 'Fear', src: 'SRD', cast: '1A', range: '30 ft cone', conc: true, rit: false, notes: 'Frightened, WIS', desc: 'You project a phantasmal image of a creature\'s worst fears. Each creature in a 30-foot cone must succeed on a WIS save or drop whatever it is holding and become frightened for the duration. While frightened by this spell, a creature must take the Dash action and move away from you by the safest available route on each of its turns, unless there is nowhere to move. If the creature ends its turn in a location where it doesn\'t have line of sight to you, the creature can make a WIS save. On a successful save, the spell ends for that creature.' },
    { lvl: '3', name: 'Fireball', src: 'SRD', cast: '1A', range: '150 ft', conc: false, rit: false, notes: '8d6 fire, 20ft, DEX', desc: 'A bright streak flashes from your pointing finger to a point you choose within range then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a DEX save. A target takes 8d6 fire damage on a failed save, or half as much on a successful one. The fire spreads around corners. It ignites flammable objects not being worn or carried. At Higher Levels: +1d6 per slot above 3rd.' },
    { lvl: '3', name: 'Fly', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: '60ft fly speed', desc: 'You touch a willing creature. The target gains a flying speed of 60 feet for the duration. When the spell ends, the target falls if it is still aloft, unless it can stop the fall. At Higher Levels: +1 target per slot level above 3rd. Duration: Concentration, up to 10 minutes.' },
    { lvl: '3', name: 'Haste', src: 'SRD', cast: '1A', range: '30 ft', conc: true, rit: false, notes: '2x spd, +2 AC, extra', desc: 'Choose a willing creature that you can see within range. Until the spell ends, the target\'s speed is doubled, it gains a +2 bonus to AC, it has advantage on DEX saves, and it gains an additional action on each of its turns. That action can be used only to take the Attack (one weapon attack only), Dash, Disengage, Hide, or Use an Object action. When the spell ends, the target can\'t move or take actions until after its next turn, as a wave of lethargy sweeps over it. Duration: Concentration, up to 1 minute.' },
    { lvl: '3', name: 'Hypnotic Pattern', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: 'Charmed/incap, WIS', desc: 'You create a twisting pattern of colors that weaves through the air inside a 30-foot cube within range. The pattern appears for a moment and vanishes. Each creature in the area who sees the pattern must make a WIS save. On a failed save, the creature becomes charmed for the duration. While charmed by this spell, the creature is incapacitated and has a speed of 0. The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor. Duration: Concentration, up to 1 minute.' },
    { lvl: '3', name: 'Lightning Bolt', src: 'SRD', cast: '1A', range: '100 ft line', conc: false, rit: false, notes: '8d6 lightning, DEX', desc: 'A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in the line must make a DEX save. A creature takes 8d6 lightning damage on a failed save, or half as much on a successful one. The lightning ignites flammable objects in the area that aren\'t being worn or carried. At Higher Levels: +1d6 per slot above 3rd.' },
    { lvl: '3', name: 'Mass Healing Word', src: 'SRD', cast: '1 BA', range: '60 ft', conc: false, rit: false, notes: '2d4+mod, 6 tgts', desc: 'As you call out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 2d4 + your spellcasting ability modifier. At Higher Levels: +1d4 per slot level above 3rd.' },
    { lvl: '3', name: 'Remove Curse', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'End curse', desc: 'At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner\'s attunement to the object so it can be removed or discarded.' },
    { lvl: '3', name: 'Revivify', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: '1 HP, 1 min, 300gp', desc: 'You touch a creature that has died within the last minute. That creature returns to life with 1 hit point. This spell can\'t return to life a creature that has died of old age, nor can it restore any missing body parts. Components: V, S, M (diamonds worth 300 gp, which the spell consumes).' },
    { lvl: '3', name: 'Slow', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: 'Half spd, -2 AC, WIS', desc: 'You alter time around up to six creatures of your choice in a 40-foot cube within range. Each target must succeed on a WIS save or be affected. An affected target\'s speed is halved, it takes a -2 penalty to AC and DEX saves, and it can\'t use reactions. On its turn, it can use either an action or a bonus action, not both. Regardless of abilities or items, it can\'t make more than one melee or ranged attack during its turn. If it tries to cast a spell with a casting time of 1 action, roll a d20. On an 11 or higher, the spell doesn\'t take effect until the creature\'s next turn, and the creature must use its action on that turn to complete the spell. If it can\'t, the spell is wasted. A creature affected by this spell makes another WIS save at the end of its turn. On a successful save, the effect ends for it.' },
    { lvl: '3', name: 'Spirit Guardians', src: 'SRD', cast: '1A', range: 'Self 15ft', conc: true, rit: false, notes: '3d8, half speed', desc: 'You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey. If you are evil, they appear fiendish. When you cast this spell, you can designate any number of creatures you can see to be unaffected by it. An affected creature\'s speed is halved in the area, and when the creature enters the area for the first time on a turn or starts its turn there, it must make a WIS save. On a failed save, the creature takes 3d8 radiant damage (if you are good or neutral) or 3d8 necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. At Higher Levels: +1d8 per slot above 3rd. Duration: Concentration, up to 10 minutes.' },
    { lvl: '3', name: 'Tongues', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'Understand all langs', desc: 'This spell grants the creature you touch the ability to understand any spoken language it hears. Moreover, when the target speaks, any creature that knows at least one language and can hear the target understands what it says. Duration: 1 hour.' },
    // Level 4
    { lvl: '4', name: 'Banishment', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'Banish to plane, CHA', desc: 'You attempt to send one creature that you can see within range to another plane of existence. The target must succeed on a CHA save or be banished. If the target is native to a different plane than the one you\'re on, the target is banished with a faint popping noise, returning to its home plane. If the spell ends before 1 minute has passed, the target reappears in the space it left or nearest unoccupied space. Otherwise, the target doesn\'t return. If the target is native to your plane, it\'s banished to a harmless demiplane and incapacitated. The target remains there until the spell ends, at which point it reappears.' },
    { lvl: '4', name: 'Blight', src: 'SRD', cast: '1A', range: '30 ft', conc: false, rit: false, notes: '8d8 necrotic, CON', desc: 'Necromantic energy washes over a creature of your choice that you can see within range, draining moisture and vitality from it. The target must make a CON save. The target takes 8d8 necrotic damage on a failed save, or half as much on a successful one. This spell has no effect on undead or constructs. If you target a plant creature or a magical plant, it makes the saving throw with disadvantage, and the spell deals maximum damage to it. If you target a nonmagical plant that isn\'t a creature, such as a tree or shrub, it doesn\'t make a saving throw; it simply withers and dies. At Higher Levels: +1d8 per slot above 4th.' },
    { lvl: '4', name: 'Dimension Door', src: 'SRD', cast: '1A', range: '500 ft', conc: false, rit: false, notes: 'Teleport +1 creature', desc: 'You teleport yourself from your current location to any other spot within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction. You can bring along objects as long as their weight doesn\'t exceed what you can carry. You can also bring one willing creature of your size or smaller who is carrying gear up to its carrying capacity. If you would arrive in a place already occupied by an object or creature, you and any creature traveling with you each take 4d6 force damage, and the spell fails.' },
    { lvl: '4', name: 'Freedom of Movement', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'Ignore restraints', desc: 'You touch a willing creature. For the duration, the target\'s movement is unaffected by difficult terrain, and spells and other magical effects can neither reduce the target\'s speed nor cause the target to be paralyzed or restrained. The target can also spend 5 feet of movement to automatically escape from nonmagical restraints. Additionally, being underwater imposes no penalties on the target\'s movement or attacks. Duration: 1 hour.' },
    { lvl: '4', name: 'Greater Invisibility', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Invisible even atking', desc: 'You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target\'s person. The invisibility doesn\'t end early if the target attacks or casts a spell. Duration: Concentration, up to 1 minute.' },
    { lvl: '4', name: 'Ice Storm', src: 'SRD', cast: '1A', range: '300 ft', conc: false, rit: false, notes: '2d8+4d6, 20ft cyl', desc: 'A hail of rock-hard ice pounds to the ground in a 20-foot-radius, 40-foot-high cylinder centered on a point within range. Each creature in the cylinder must make a DEX save. A creature takes 2d8 bludgeoning damage and 4d6 cold damage on a failed save, or half as much on a successful one. Hailstones turn the storm\'s area of effect into difficult terrain until the end of your next turn. At Higher Levels: bludgeoning damage increases by 1d8 per slot above 4th.' },
    { lvl: '4', name: 'Polymorph', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'Transform to beast, temp HP', desc: 'This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a WIS save to avoid the effect. The new form can be any beast whose CR is equal to or less than the target\'s (or its level). The target gains temporary hit points equal to the hit points of the beast form. The target\'s game statistics are replaced by the statistics of the chosen beast, but it retains its alignment, personality, creature type, hit points, and Hit Dice. The transformation lasts for the duration, until the temp HP are depleted, or the target dies. It can\'t speak, cast spells, or take actions requiring hands or speech. Duration: Concentration, up to 1 hour.' },
    { lvl: '4', name: 'Stoneskin', src: 'SRD', cast: '1A', range: 'Touch', conc: true, rit: false, notes: 'Resist nonmag B/P/S', desc: 'This spell turns the flesh of a willing creature you touch as hard as stone. Until the spell ends, the target has resistance to nonmagical bludgeoning, piercing, and slashing damage. Duration: Concentration, up to 1 hour. Components: V, S, M (diamond dust worth 100 gp, which the spell consumes).' },
    { lvl: '4', name: 'Wall of Fire', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '5d8 fire, 60ft long', desc: 'You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. When the wall appears, each creature within its area must make a DEX save. On a failed save, a creature takes 5d8 fire damage, or half as much on a successful save. One side of the wall, selected by you when you cast this spell, deals 5d8 fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage. At Higher Levels: +1d8 per slot above 4th. Duration: Concentration, up to 1 minute.' },
    // Level 5
    { lvl: '5', name: 'Cloudkill', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '5d8 poison, 20ft', desc: 'You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses it. Its area is heavily obscured. When a creature enters the spell\'s area for the first time on a turn or starts its turn there, that creature must make a CON save. The creature takes 5d8 poison damage on a failed save, or half as much on a successful one. Creatures are affected even if they hold their breath or don\'t need to breathe. The fog moves 10 feet away from you at the start of each of your turns, rolling along the surface of the ground. At Higher Levels: +1d8 per slot above 5th. Duration: Concentration, up to 10 minutes.' },
    { lvl: '5', name: 'Cone of Cold', src: 'SRD', cast: '1A', range: '60 ft cone', conc: false, rit: false, notes: '8d8 cold, CON', desc: 'A blast of cold air erupts from your hands. Each creature in a 60-foot cone must make a CON save. A creature takes 8d8 cold damage on a failed save, or half as much on a successful one. A creature killed by this spell becomes a frozen statue until it thaws. At Higher Levels: +1d8 per slot above 5th.' },
    { lvl: '5', name: 'Flame Strike', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '4d6 fire+4d6 radiant', desc: 'A vertical column of divine fire roars down from the heavens in a location you specify. Each creature in a 10-foot-radius, 40-foot-high cylinder centered on a point within range must make a DEX save. A creature takes 4d6 fire damage and 4d6 radiant damage on a failed save, or half as much on a successful one. At Higher Levels: +1d6 fire damage OR +1d6 radiant damage (your choice) per slot above 5th.' },
    { lvl: '5', name: 'Greater Restoration', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'End charm/petrify/etc', desc: 'You imbue a creature you touch with positive energy to undo a debilitating effect. You can reduce the target\'s exhaustion level by one, or end one of the following effects on the target: one effect that charmed or petrified the target, one curse (including the target\'s attunement to a cursed magic item), any reduction to one of the target\'s ability scores, or one effect reducing the target\'s hit point maximum. Components: V, S, M (diamond dust worth at least 100 gp, which the spell consumes).' },
    { lvl: '5', name: 'Hold Monster', src: 'SRD', cast: '1A', range: '90 ft', conc: true, rit: false, notes: 'Paralyze any, WIS', desc: 'Choose a creature that you can see within range. The target must succeed on a WIS save or be paralyzed for the duration. This spell has no effect on undead. At the end of each of its turns, the target can make another WIS save. On a success, the spell ends on the target. At Higher Levels: +1 target per slot level above 5th. Each target must be within 30 feet of another target. Duration: Concentration, up to 1 minute.' },
    { lvl: '5', name: 'Mass Cure Wounds', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '5d8+mod, 6 tgts', desc: 'A wave of healing energy washes out from a point of your choice within range. Choose up to six creatures in a 30-foot-radius sphere centered on that point. Each target regains hit points equal to 5d8 + your spellcasting ability modifier. At Higher Levels: +1d8 per slot level above 5th.' },
    { lvl: '5', name: 'Raise Dead', src: 'SRD', cast: '1 hour', range: 'Touch', conc: false, rit: false, notes: 'Life, 10 days, 500gp', desc: 'You return a dead creature you touch to life, provided that it has been dead no longer than 10 days. If the creature\'s soul is both willing and at liberty to rejoin the body, the creature returns to life with 1 HP. This spell also neutralizes any poisons and cures nonmagical diseases that affected the creature at the time of death. This spell doesn\'t remove magical diseases, curses, or similar effects; if these aren\'t first removed prior to casting the spell, they take effect when the creature returns to life. This spell can\'t return an undead creature to life. This spell closes all mortal wounds, but it doesn\'t restore missing body parts. Coming back to life this way takes a toll on the body. The target takes a -4 penalty to all attack rolls, saving throws, and ability checks. Every time the target finishes a long rest, the penalty is reduced by 1 until it disappears. Components: V, S, M (a diamond worth at least 500 gp, which the spell consumes).' },
    { lvl: '5', name: 'Telekinesis', src: 'SRD', cast: '1A', range: '60 ft', conc: true, rit: false, notes: 'Move 1000 lb/creature', desc: 'You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell, and as your action each round for the duration, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round, or choose a new one at any time. Creature: Make an ability check with your spellcasting ability contested by the creature\'s STR check. If you win, you can move it up to 30 feet in any direction, including upward, but not beyond the range of this spell. Until the end of your next turn, the creature is restrained. Object: You can try to move an object that weighs up to 1,000 pounds. If the object isn\'t being worn or carried, you automatically move it up to 30 feet in any direction, but not beyond the range of this spell. Duration: Concentration, up to 10 minutes.' },
    { lvl: '5', name: 'Wall of Force', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: 'Invisible wall, 10 pnl', desc: 'An invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a sphere with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick. Nothing can physically pass through the wall. It is immune to all damage and can\'t be dispelled by dispel magic. A disintegrate spell destroys the wall instantly. The wall also extends into the Ethereal Plane, blocking ethereal travel through the wall. Duration: Concentration, up to 10 minutes.' },
    { lvl: '5', name: 'Wall of Stone', src: 'SRD', cast: '1A', range: '120 ft', conc: true, rit: false, notes: '10 panels, 10x10 each', desc: 'A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with at least one other panel. Alternatively, you can create 10-foot-by-20-foot panels that are only 3 inches thick. If the wall cuts through a creature\'s space when it appears, the creature is pushed to one side of the wall (your choice). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a DEX save. On a success, it can use its reaction to move up to its speed so that it is no longer enclosed by the wall. The wall can have any shape you desire, though it can\'t occupy the same space as a creature or object. The wall doesn\'t need to be vertical or rest on any firm foundation. It must, however, merge with and be solidly supported by existing stone. If the wall is not perfectly supported and target creatures don\'t breach it, you still get partial walls or columns. If you maintain concentration for the spell\'s full duration, the wall becomes permanent and can\'t be dispelled. Otherwise, the wall disappears when the spell ends. Duration: Concentration, up to 10 minutes.' },
    // Level 6+
    { lvl: '6', name: 'Chain Lightning', src: 'SRD', cast: '1A', range: '150 ft', conc: false, rit: false, notes: '10d8, 4 targets', desc: 'You create a bolt of lightning that arcs toward a target of your choice that you can see within range. Three bolts then leap from that target to as many as three other targets, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts. A target must make a DEX save. The target takes 10d8 lightning damage on a failed save, or half as much on a successful one. At Higher Levels: +1 additional bolt per slot above 6th.' },
    { lvl: '6', name: 'Disintegrate', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '10d6+40 force, DEX', desc: 'A thin green ray springs from your pointing finger to a target that you can see within range. The target can be a creature, an object, or a creation of magical force, such as the wall created by wall of force. A creature targeted by this spell must make a DEX save. On a failed save, the target takes 10d6+40 force damage. The target is disintegrated if this damage reduces the creature to 0 HP. A disintegrated creature and everything it is wearing and carrying, except magic items, are reduced to a pile of fine gray dust. The creature can be restored to life only by means of a true resurrection or a wish spell. This spell automatically disintegrates a Large or smaller nonmagical object or a creation of magical force. If the target is a Huge or larger object or creation of force, this spell disintegrates a 10-foot-cube portion of it. A magic item is unaffected by this spell. At Higher Levels: +3d6 per slot above 6th.' },
    { lvl: '6', name: 'Heal', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '70 HP healing', desc: 'Choose a creature that you can see within range. A surge of positive energy washes through the creature, causing it to regain 70 hit points. This spell also ends blindness, deafness, and any diseases affecting the target. This spell has no effect on constructs or undead. At Higher Levels: +10 HP per slot above 6th.' },
    { lvl: '6', name: 'Heroes\' Feast', cast: '10 min', range: '30 ft', conc: false, rit: false, notes: 'Cure, immune, +2d10 HP', desc: 'You bring forth a great feast, including magnificent food and drink. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don\'t set in until this hour is over. Up to twelve creatures can partake of the feast. A creature that partakes of the feast gains several benefits. The creature is cured of all diseases and poison, becomes immune to poison and being frightened, and makes all WIS saves with advantage. Its HP maximum also increases by 2d10, and it gains the same number of HP. These benefits last for 24 hours. Components: V, S, M (a gem-encrusted bowl worth at least 1,000 gp, which the spell consumes).' },
    { lvl: '6', name: 'Sunbeam', src: 'SRD', cast: '1A', range: '60 ft line', conc: true, rit: false, notes: '6d8 radiant, blinded', desc: 'A beam of brilliant light flashes out from your hand in a 5-foot-wide, 60-foot-long line. Each creature in the line must make a CON save. On a failed save, a creature takes 6d8 radiant damage and is blinded until your next turn. On a successful save, it takes half as much damage and isn\'t blinded by this spell. Undead and oozes have disadvantage on this saving throw. You can create a new line of radiance as your action on any turn until the spell ends. For the duration, a mote of brilliant radiance shines in your hand. It sheds bright light in a 30-foot radius and dim light for an additional 30 feet. This light is sunlight. Duration: Concentration, up to 1 minute.' },
    { lvl: '6', name: 'True Seeing', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'Truesight 120ft, 1hr', desc: 'This spell gives the willing creature you touch the ability to see things as they actually are. For the duration, the creature has truesight, notices secret doors hidden by magic, and can see into the Ethereal Plane, all out to a range of 120 feet. Duration: 1 hour. Components: V, S, M (an ointment for the eyes that costs 25 gp, is made from mushroom powder, saffron, and fat, and is consumed by the spell).' },
    { lvl: '7', name: 'Divine Word', src: 'SRD', cast: '1 BA', range: '30 ft', conc: false, rit: false, notes: 'Kill low HP, banish', desc: 'You utter a divine word, imbued with the power that shaped the world at the dawn of creation. Choose any number of creatures you can see within range. Each creature that can hear you must make a CHA save. On a failed save, a creature suffers an effect based on its current HP: 50 or fewer (deafened 1 min), 40 or fewer (deafened and blinded 10 min), 30 or fewer (blinded, deafened, stunned 1 hour), 20 or fewer (killed instantly). Regardless of HP, a celestial, elemental, fey, or fiend that fails its save is forced back to its plane of origin and can\'t return for 24 hours by any means. If it\'s already there, it\'s banished to the Astral Plane.' },
    { lvl: '7', name: 'Finger of Death', src: 'SRD', cast: '1A', range: '60 ft', conc: false, rit: false, notes: '7d8+30 necrotic', desc: 'You send negative energy coursing through a creature that you can see within range, causing it searing pain. The target must make a CON save. It takes 7d8+30 necrotic damage on a failed save, or half as much on a successful one. A humanoid killed by this spell rises at the start of your next turn as a zombie that is permanently under your command, following your verbal orders to the best of its ability.' },
    { lvl: '7', name: 'Fire Storm', src: 'SRD', cast: '1A', range: '150 ft', conc: false, rit: false, notes: '7d10 fire, 10 cubes', desc: 'A storm made up of sheets of roaring flame appears in a location you choose within range. The area of the storm consists of up to ten 10-foot cubes, which you can arrange as you wish. Each cube must have at least one face adjacent to the face of another cube. Each creature in the area must make a DEX save. It takes 7d10 fire damage on a failed save, or half as much damage on a successful one. The fire damages objects in the area and ignites flammable objects that aren\'t being worn or carried. If you choose, plant life in the area is unaffected by this spell.' },
    { lvl: '7', name: 'Plane Shift', src: 'SRD', cast: '1A', range: 'Touch', conc: false, rit: false, notes: 'Travel other planes', desc: 'You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination. Alternatively, you can use this spell offensively to banish an unwilling creature to another plane. Choose a creature within your reach and make a melee spell attack. On hit, the creature must make a CHA save. If it fails, it is transported to a random location on the plane of existence you specify. Components: V, S, M (a forked, metal rod worth at least 250 gp, attuned to a particular plane of existence).' },
    { lvl: '7', name: 'Regenerate', src: 'SRD', cast: '1 min', range: 'Touch', conc: false, rit: false, notes: '4d8+15, regrow limbs', desc: 'You touch a creature and stimulate its natural healing ability. The target regains 4d8+15 hit points. For the duration of the spell, the target regains 1 HP at the start of each of its turns (10 HP each minute). The target\'s severed body members (fingers, legs, tails, and so on), if any, are restored after 2 minutes. If you have the severed part and hold it to the stump, the spell instantaneously causes the limb to knit to the stump. Duration: 1 hour.' },
    { lvl: '7', name: 'Resurrection', src: 'SRD', cast: '1 hour', range: 'Touch', conc: false, rit: false, notes: 'Life, 100yr, 1000gp', desc: 'You touch a dead creature that has been dead for no more than a century, that didn\'t die of old age, and that isn\'t undead. If its soul is free and willing, the target returns to life with all its HP. This spell neutralizes any poisons and cures normal diseases afflicting the creature when it died. It doesn\'t, however, remove magical diseases, curses, and the like; if such effects aren\'t removed prior to casting the spell, they afflict the target on its return to life. This spell closes all mortal wounds and restores any missing body parts. Coming back from the dead is an ordeal. The target takes a -4 penalty to all attack rolls, saving throws, and ability checks. Every time the target finishes a long rest, the penalty is reduced by 1 until it disappears. Components: V, S, M (a diamond worth at least 1,000 gp, which the spell consumes).' },
    { lvl: '7', name: 'Teleport', src: 'SRD', cast: '1A', range: '10 ft', conc: false, rit: false, notes: 'Transport 8 anywhere', desc: 'This spell instantly transports you and up to eight willing creatures of your choice that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be able to fit entirely inside a 10-foot cube, and it can\'t be held or carried by an unwilling creature. The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The DM rolls d100 and consults the Teleport table, with results ranging from on target (familiar location) to mishap (unfamiliar location).' },

      'inlineHelp.deathSaves.title': 'Death Saves',
      'inlineHelp.deathSaves.content': 'When you drop to 0 HP, you make death saving throws. Roll a d20: <strong>10 or higher</strong> = success, <strong>9 or lower</strong> = failure. <strong>3 successes</strong> = stabilized, <strong>3 failures</strong> = death. A <strong>natural 20</strong> restores 1 HP, a <strong>natural 1</strong> counts as 2 failures.',
      'inlineHelp.spellSlots.title': 'Spell Slots',
      'inlineHelp.spellSlots.content': 'Spell slots represent your magical energy. Each slot can cast one spell of its level or lower. Higher-level slots can cast lower-level spells at higher potency. Slots refresh on a <strong>long rest</strong> (some classes recover slots on short rests).',
      'inlineHelp.hitDice.title': 'Hit Dice',
      'inlineHelp.hitDice.content': 'Hit Dice are used for healing during <strong>short rests</strong>. Roll one or more of your hit dice and add your Constitution modifier to regain HP. You recover half your total hit dice (minimum 1) on a <strong>long rest</strong>.',
      'inlineHelp.initiative.title': 'Initiative',
      'inlineHelp.initiative.content': 'Initiative determines combat order. Roll <strong>d20 + Dexterity modifier</strong> at the start of combat. Higher results act first. Click the initiative stat to roll automatically.',
      'inlineHelp.armorClass.title': 'Armor Class',
